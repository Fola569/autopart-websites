<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
background-color: transparent;        }

        .slider-container {
            width: 80%;
            max-width: 1000px;
            margin: 50px auto;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
        }

        .slides {
            position: relative;
            width: 100%;
            height: 500px;
        }

        .slides img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .slides img.active {
            opacity: 1;
        }

        .caption {
            position: absolute;
            bottom: 10px;
            left: 20px;
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        /* Navigation dots */
        .dots {
            text-align: center;
            position: absolute;
            bottom: 20px;
            width: 100%;
        }

        .dot {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin: 5px;
            background-color: #bbb;
            border-radius: 50%;
            cursor: pointer;
        }

        .dot.active {
            background-color: #717171;
        }

        /* Touch gestures */
        .slider-container {
            touch-action: pan-y;
        }
    </style>
</head>
<body>

<div class="slider-container">
    <div class="slides">
        <img src="sl1.jpg" alt="Slide 1" class="active">
        <img src="sl2.jpg" alt="Slide 2">
        <img src="sl3.jpg" alt="Slide 3">
        <img src="sl4.jpg" alt="Slide 4">
        <img src="sl5.jpg" alt="Slide 5">
        <div class="caption">Caption for slide 1</div>
    </div>
    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
</div>

<script>
    const slides = document.querySelectorAll('.slides img');
    const dots = document.querySelectorAll('.dot');
    const captions = [
        'Caption for slide 1',
        'Caption for slide 2',
        'Caption for slide 3',
        'Caption for slide 4',
        'Caption for slide 5'
    ];

    let currentSlide = 0;
    let slideInterval = setInterval(nextSlide, 6000); // Auto-slide every 6 seconds

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.remove('active');
            dots[i].classList.remove('active');
        });
        slides[index].classList.add('active');
        dots[index].classList.add('active');
        document.querySelector('.caption').innerText = captions[index];
        currentSlide = index;
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }

    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            clearInterval(slideInterval);
            showSlide(index);
            slideInterval = setInterval(nextSlide, 6000); // Restart auto-slide after manual navigation
        });
    });

    let startX = 0;
    let endX = 0;

    // Add touch event listeners for swipe gestures
    document.querySelector('.slider-container').addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
    });

    document.querySelector('.slider-container').addEventListener('touchend', (e) => {
        endX = e.changedTouches[0].clientX;
        if (startX - endX > 50) {
            nextSlide();
        } else if (endX - startX > 50) {
            prevSlide();
        }
    });

</script>

</body>
</html>
