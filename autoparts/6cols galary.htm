<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6-Column Grid Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 15px;
    }

    .gallery-item {
      background-color: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .gallery-item img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
    }

    .caption {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
    }

    .gallery-item button {
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #ff5f5f;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 500px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="sl1.jpg" alt="Image 1">
        <div class="caption">Caption 1</div>
        <button>Learn More</button>
      </div>
      <div class="gallery-item">
        <img src="sl2.jpg" alt="Image 2">
        <div class="caption">Caption 2</div>
        <button>Learn More</button>
      </div>
      <div class="gallery-item">
        <img src="sl3.jpg" alt="Image 3">
        <div class="caption">Caption 3</div>
        <button>Learn More</button>
      </div>
      <div class="gallery-item">
        <img src="sl4.jpg" alt="Image 4">
        <div class="caption">Caption 4</div>
        <button>Learn More</button>
      </div>
      <div class="gallery-item">
        <img src="sl5.jpg" alt="Image 5">
        <div class="caption">Caption 5</div>
        <button>Learn More</button>
      </div>
      <div class="gallery-item">
        <img src="sl6.jpg" alt="Image 6">
        <div class="caption">Caption 6</div>
        <button>Learn More</button>
      </div>
    </div>
  </div>

</body>
</html>
