<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Slider with Zoom and Caption</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .slider-container {
      width: 600px;
      height: 400px;
      position: relative;
      overflow: hidden;
    }

    .slider {
      display: flex;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      min-width: 100%;
      height: 100%;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: zoom 20s infinite ease-in-out;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }

    .caption {
      position: relative;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      z-index: 2;
      opacity: 0;
      animation: slide-in 1.5s ease-in 1s forwards;
    }

    .slide button {
      position: relative;
      z-index: 2;
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #ff5f5f;
      color: white;
      border: none;
      cursor: pointer;
      opacity: 0;
      animation: slide-in 1.5s ease-in 2s forwards;
    }

    @keyframes zoom {
      0% { transform: scale(1); opacity: 1; }
      25% { transform: scale(1.1); opacity: 1; }
      50% { transform: scale(1); opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes slide-in {
      0% { opacity: 0; transform: translateY(50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .slide:nth-child(1) { animation-delay: 0s; }
    .slide:nth-child(2) { animation-delay: 5s; }
    .slide:nth-child(3) { animation-delay: 10s; }
    .slide:nth-child(4) { animation-delay: 15s; }
  </style>
</head>
<body>

  <div class="slider-container">
    <div class="slider">
      <div class="slide">
        <img src="sl1.jpg" alt="Slide 1">
        <div class="caption">Caption 1</div>
        <button>Learn More</button>
      </div>
      <div class="slide">
        <img src="sl2.jpg" alt="Slide 2">
        <div class="caption">Caption 2</div>
        <button>Learn More</button>
      </div>
      <div class="slide">
        <img src="sl3.jpg" alt="Slide 3">
        <div class="caption">Caption 3</div>
        <button>Learn More</button>
      </div>
      <div class="slide">
        <img src="sl4.jpg" alt="Slide 4">
        <div class="caption">Caption 4</div>
        <button>Learn More</button>
      </div>
    </div>
  </div>

</body>
</html>
