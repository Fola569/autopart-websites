<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masked Text with Image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .masked-text {
      font-size: 8rem;
      font-weight: bold;
      position: relative;
      color: transparent;
      -webkit-text-stroke: 2px black; /* Optional stroke around the text */
      background: url('sl3.jpg') no-repeat center/cover;
      -webkit-background-clip: text;
      background-clip: text;
    }
  </style>
</head>
<body>

  <div class="masked-text">
    Modeliza
  </div>

</body>
</html>
